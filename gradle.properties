kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
# SQLDelight's Android driver (the outbox on the system SQLite) depends on androidx.sqlite.
android.useAndroidX=true

# Kotlin 2.4.20: incremental compilation of klibs (Beta); local builds only recompile what changed. CI and releases
# build from a clean tree.
kotlin.incremental.native=true
