name: CI

# The SDK's tests on macOS (native and JVM) and Linux x64 (native over epoll and io_uring, and JVM), and the Android
# facade's unit tests. msgtrans and io come from Maven Central (settings.gradle.kts includes the sibling checkouts only
# where they exist). Any branch, PRs, or by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-14, tasks: ":pulsekit:macosArm64Test :pulsekit:jvmTest", driver: "" }
          - { name: Linux epoll, os: ubuntu-latest, tasks: ":pulsekit:linuxX64Test :pulsekit:jvmTest", driver: epoll }
          - { name: Linux io_uring, os: ubuntu-latest, tasks: ":pulsekit:linuxX64Test", driver: iouring }
          - { name: Android unit, os: ubuntu-latest, tasks: ":pulsekit-android:testDebugUnitTest", driver: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NETON_IO_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: SQLite for the Linux binaries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev
      - name: Test
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace --continue
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re
          tests = fails = 0; failed = []
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8', errors='replace').read()
              m = re.search(r'tests="(\d+)"', s); tests += int(m.group(1)) if m else 0
              for c in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  fails += 1; failed.append(f"- {c.group(2)}.{c.group(1)}: {c.group(3)[:300]}")
          print(f"### ${{ matrix.name }}: {tests} tests, {fails} failures")
          print("\n".join(failed))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            */build/test-results/**
            */build/reports/tests/**
          if-no-files-found: ignore
